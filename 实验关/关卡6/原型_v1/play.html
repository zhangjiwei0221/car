<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>006 可玩原型 v1</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f0e8; color: #33281f; }
    header { padding: 18px 22px; background: #fffaf2; border-bottom: 1px solid #e7d8c4; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    .muted { color: #806f5f; font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(360px, 650px) minmax(280px, 1fr); gap: 22px; padding: 22px; max-width: 1180px; margin: auto; }
    .panel { background: #fffaf2; border: 1px solid #e7d8c4; border-radius: 12px; padding: 14px; box-shadow: 0 4px 18px rgba(80, 50, 20, .05); }
    .target { display: grid; width: min(100%, 630px); aspect-ratio: 1; margin: auto; gap: 0; image-rendering: pixelated; }
    .target div { min-width: 0; min-height: 0; }
    .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 520px; margin: 12px auto 0; }
    .cell { aspect-ratio: 1; border: 2px solid transparent; border-radius: 8px; color: #fff; font-weight: 800; cursor: default; display: flex; align-items: center; justify-content: center; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
    .cell.active { border-color: #1c9b59; box-shadow: 0 0 0 3px rgba(28,155,89,.16); cursor: pointer; }
    .cell.next { border-color: #d97706; box-shadow: 0 0 0 4px rgba(217,119,6,.24); }
    .cell.blocked { filter: grayscale(.6); opacity: .55; }
    .cell.empty { background: #e6ddd0 !important; border: 1px dashed #c9b8a2; }
    .cell.pipe-cell { background: #4d6070; border-color: #263541; color: #fff; }
    .pipe-meta { display: block; font-size: 10px; font-weight: 600; text-shadow: none; }
    .ice-badge { display: block; margin-top: -3px; padding: 1px 4px; border-radius: 8px; background: #eef8ff; color: #24546f; font-size: 10px; line-height: 1.25; text-shadow: none; }
    .chain-badge { display: inline-block; margin-left: 4px; padding: 1px 4px; border-radius: 8px; background: #fff0d7; color: #7a4613; font-size: 10px; line-height: 1.25; text-shadow: none; }
    .buffer { display: grid; grid-template-columns: repeat(5, 54px); gap: 8px; margin: 14px 0; }
    .slot { width: 54px; height: 54px; border: 2px solid #d9c8b3; border-radius: 9px; background: #f8f2e9; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 12px; }
    button { border: 0; border-radius: 8px; padding: 9px 14px; background: #5b4634; color: white; cursor: pointer; font-weight: 700; }
    button.secondary { background: #8a6a4d; }
    .beats { display: grid; gap: 6px; margin: 12px 0; }
    .beat { padding: 7px 9px; border: 1px solid #e7d8c4; border-radius: 8px; background: #fbf5ec; }
    .beat strong { display: block; font-size: 13px; }
    .beat span { color: #806f5f; font-size: 12px; }
    .beat.active { border-color: #d97706; background: #fff2dd; }
    pre { white-space: pre-wrap; font-size: 12px; max-height: 180px; overflow: auto; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; padding: 12px; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">006 · 可玩原型 v1</h1>
    <span id="meta" class="muted">载入中…</span>
    <button id="reset">重新开始</button>
    <label class="muted" style="display:flex;gap:6px;align-items:center">消除顺序
      <select id="rule">
        <option value="ring">层号（外→内）</option>
        <option value="corner">左下角（曼哈顿）</option>
        <option value="bottom">底边（从下往上）</option>
        <option value="instantChain">瞬时连锁（旧）</option>
      </select>
    </label>
    <button id="story" class="secondary">自动演示故事</button>
  </header>
  <main>
    <section class="panel">
      <div id="target" class="target"></div>
    </section>
    <section class="panel">
      <div id="status" class="muted">载入中…</div>
      <div id="beats" class="beats"></div>
      <div id="board" class="board"></div>
      <h2 style="font-size:15px;margin-bottom:4px">暂存</h2>
      <div id="buffer" class="buffer"></div>
      <h2 style="font-size:15px;margin-bottom:4px">操作</h2>
      <pre id="log">点击绿色边框车辆开始。</pre>
    </section>
  </main>
  <script src="../../../02_工程/游戏主bin/bin/js/utils.js"></script>
  <script src="../../../02_工程/游戏主bin/bin/js/color-libs.js"></script>
  <script src="../../../02_工程/游戏主bin/bin/js/simulator.js"></script>
  <script>
    let raw, level, state, moves = [], logLines = [];
    let storyRoute = null, storyRunning = false, storyNext = null, storyStep = 0;
    let storyBeats = [];
    const STORY_BEATS_V8 = [
      { from: 1, to: 2, label: '教学', detail: '30/22 → 15/24' },
      { from: 3, to: 4, label: '第一笔债务', detail: '17/26 欠10 → 31/30 释放' },
      { from: 5, to: 6, label: '第二拍', detail: '34/25 欠6 → 5/40 释放' },
      { from: 7, to: 8, label: '承诺加深', detail: '34、17 同时进入暂存' },
      { from: 9, to: 29, label: '长等待与推进', detail: '34 色欠额从20降到1' },
      { from: 30, to: 31, label: '空间揭示', detail: 'R59 / R65 首次可达' },
      { from: 32, to: 35, label: '偿还长债', detail: '34 色债务释放' },
      { from: 36, to: 42, label: '收束准备', detail: '继续打开末端区域' },
      { from: 43, to: 44, label: '终局', detail: '22欠4 → 15/24 释放' },
      { from: 45, to: 47, label: '收尾', detail: '连续收满' }
    ];
    const STORY_BEATS_V15 = [
      { from: 1, to: 7, label: '开放开局', detail: '7个入口全部有实际消除' },
      { from: 8, to: 9, label: '第一压力窗口', detail: '同色多车债务，buffer达到3' },
      { from: 10, to: 10, label: '第一释放', detail: '31/31打开区域，债务先下降1' },
      { from: 11, to: 20, label: '继续铺路', detail: '保留同色债务，继续打开中段区域' },
      { from: 21, to: 28, label: '第二压力窗口', detail: '混色债务，buffer达到4' },
      { from: 29, to: 30, label: '第二释放', detail: '33/20打开区域，buffer下降2' },
      { from: 31, to: 42, label: '二连锁承诺', detail: '15/25完成并被扣住，等待30/23补齐' },
      { from: 43, to: 45, label: '组债释放', detail: '后续区域补齐同组车辆，压力逐级下降' },
      { from: 46, to: 47, label: '收尾', detail: '完成剩余区域' }
    ];
    const STORY_BEATS_V17 = [
      { from: 1, to: 7, label: '开放开局', detail: '7个入口全部有实际消除' },
      { from: 8, to: 9, label: '第一压力窗口', detail: '同色多车债务，buffer达到3' },
      { from: 10, to: 10, label: '第一释放', detail: '31/31打开区域，债务先下降1' },
      { from: 11, to: 20, label: '继续铺路', detail: '保留债务，继续打开中段区域' },
      { from: 21, to: 28, label: '第二压力窗口', detail: '混色债务，buffer达到4' },
      { from: 29, to: 31, label: '第二释放与衔接', detail: '33/20打开区域，buffer下降2' },
      { from: 32, to: 44, label: '相邻三连锁 + 管道', detail: '28完成等待34欠1、30欠6；管道释放13/28' },
      { from: 45, to: 45, label: '组债释放', detail: '后续区域补齐三连锁，buffer归零' },
      { from: 46, to: 47, label: '收尾', detail: '完成剩余区域' }
    ];

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function color(id) {
      return window.AntSolver.getColorCSS(id);
    }

    function moveMap() {
      const map = {};
      for (const m of moves) map[m.r + ',' + m.c] = m;
      return map;
    }

    function renderTarget() {
      const el = document.getElementById('target');
      const rows = state.blocks.length;
      const cols = state.blocks[0].length;
      el.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
      const bits = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const id = state.blocks[r][c];
          const eliminated = state.eliminated[r][c];
          const bg = id > 0 ? color(id) : '#ffffff';
          bits.push('<div style="background:' + bg + ';opacity:' + (eliminated ? '.18' : '1') + '"></div>');
        }
      }
      el.innerHTML = bits.join('');
    }

    function renderBoard() {
      const el = document.getElementById('board');
      const mm = moveMap();
      const bits = [];
      for (let r = 0; r < state.boardRows; r++) {
        for (let c = 0; c < state.boardCols; c++) {
          const cell = state.cells[r][c];
          const m = mm[r + ',' + c];
          if (!cell) {
            bits.push('<div class="cell empty"></div>');
          } else if (cell.t === 'box') {
            const isNext = storyNext && storyNext.r === r && storyNext.c === c;
            const cls = m ? (m.blocked ? 'cell blocked' : 'cell active' + (isNext ? ' next' : '')) : 'cell blocked';
            const ice = state.numice && state.numice[r + ',' + c] && state.numice[r + ',' + c].remaining;
            bits.push('<button class="' + cls + '" style="background:' + color(cell.color) + '" data-r="' + r + '" data-c="' + c + '">' +
              cell.count +
              (ice ? '<span class="ice-badge">❄' + ice + '</span>' : '') +
              (cell.chain > 0 ? '<span class="chain-badge">链</span>' : '') +
              '</button>');
          } else if (cell.t === 'pipe') {
            const arrows = { 11: '↑', 12: '→', 13: '↓', 14: '←' };
            bits.push('<div class="cell blocked pipe-cell">管' + (arrows[cell.dir] || '?') +
              '<span class="pipe-meta">' + cell.next + '/' + (cell.queue || []).length + '</span></div>');
          } else {
            bits.push('<div class="cell blocked">✕</div>');
          }
        }
      }
      el.innerHTML = bits.join('');
      for (const button of el.querySelectorAll('button.active')) {
        button.addEventListener('click', () => pick(+button.dataset.r, +button.dataset.c));
      }
    }

    function renderBuffer() {
      const el = document.getElementById('buffer');
      const bits = [];
      for (let i = 0; i < state.bufferLimit; i++) {
        const item = state.buffer.find(x => x.slot === i);
        if (!item) bits.push('<div class="slot"></div>');
        else bits.push('<div class="slot" style="background:' + color(item.color) + '"><span>' + item.progress + '/' + item.need + '</span></div>');
      }
      el.innerHTML = bits.join('');
    }

    function update() {
      moves = window.AntSolver.Simulator.listMoves(state);
      renderTarget();
      renderBoard();
      renderBuffer();
      const status = document.getElementById('status');
      const progress = state.totalPixels ? Math.round(state.eliminatedPixels / state.totalPixels * 100) : 0;
      const demo = storyRunning && storyStep ? ' · 演示第 ' + storyStep + ' 步' : '';
      status.textContent = state.gameWon ? '通关！' + demo : (state.gameOver ? '失败' + demo : '进度 ' + progress + '% · 已取 ' + state.completedBoxes + '/' + state.totalBoxes + ' · 暂存 ' + state.buffer.length + '/' + state.bufferLimit + demo);
      document.getElementById('log').textContent = logLines.slice(-12).join('\n') || '点击绿色边框车辆开始。';
      renderBeats();
    }

    function currentBeat() {
      return storyBeats.find(x => storyStep >= x.from && storyStep <= x.to) || null;
    }

    function renderBeats() {
      const el = document.getElementById('beats');
      if (!storyRoute) {
        el.innerHTML = '';
        return;
      }
      const active = currentBeat();
      el.innerHTML = storyBeats.map(x =>
        '<div class="beat' + (active === x ? ' active' : '') + '">' +
        '<strong>' + x.from + '–' + x.to + ' · ' + x.label + '</strong>' +
        '<span>' + x.detail + '</span></div>'
      ).join('');
    }

    function pick(r, c) {
      if (storyRunning) return;
      if (state.gameOver) return;
      const m = moves.find(x => x.r === r && x.c === c);
      if (!m || m.blocked) return;
      const cell = state.cells[r][c];
      logLines.push('取 ' + cell.color + '色/' + cell.count);
      window.AntSolver.Simulator.applyPick(state, r, c);
      update();
    }

    async function runStory() {
      if (!storyRoute) return;
      if (storyRunning) {
        storyRunning = false;
        return;
      }
      storyRunning = true;
      storyNext = null;
      storyStep = 0;
      document.getElementById('story').textContent = '停止演示';
      state = window.AntSolver.Simulator.enter(level, { useSlotStart: true, instantChain: true });
      logLines = ['自动演示开始'];
      update();
      const rawPicks = storyRoute.playerRuns.find(x => x.reviveCap === 0 && x.seed === 7).pickOrder;
      const seenSteps = new Set();
      const picks = rawPicks.filter(x => {
        if (seenSteps.has(x.step)) return false;
        seenSteps.add(x.step);
        return true;
      });
      for (const expected of picks) {
        if (!storyRunning) break;
        storyStep = expected.step;
        storyNext = { r: expected.r, c: expected.c };
        update();
        await sleep(260);
        if (!storyRunning) break;
        const move = moves.find(x => x.r === expected.r && x.c === expected.c && !x.blocked);
        if (!move) {
          logLines.push('演示中断：找不到 ' + expected.r + ',' + expected.c);
          storyRunning = false;
          break;
        }
        const beat = currentBeat();
        if (beat && storyStep === beat.from) logLines.push('【' + beat.label + '】' + beat.detail);
        const cell = state.cells[expected.r][expected.c];
        logLines.push('取 ' + cell.color + '色/' + cell.count);
        window.AntSolver.Simulator.applyPick(state, expected.r, expected.c);
        storyNext = null;
        update();
      }
      storyRunning = false;
      storyNext = null;
      document.getElementById('story').textContent = '自动演示故事';
      update();
    }

    function currentRule() {
      var q = new URLSearchParams(location.search).get('rule');
      return q || document.getElementById('rule').value || 'ring';
    }
    function applyRule() {
      var rule = currentRule();
      document.getElementById('rule').value = rule;
      var Sim = window.AntSolver.Simulator;
      if (rule === 'instantChain') return { instantChain: true, label: '瞬时连锁' };
      Sim.setPickRef(rule);
      return { instantChain: false, label: rule === 'corner' ? '左下角' : rule === 'bottom' ? '底边' : '层号' };
    }

    async function boot() {
      storyRunning = false;
      storyNext = null;
      const levelPath = new URLSearchParams(location.search).get('level') || '关卡_实验_v1.json';
      raw = await fetch(levelPath).then(r => r.json());
      level = window.AntSolver.parseLevel(window.AntSolver.fromGameFormat(raw));
      const ruleCfg = applyRule();
      state = window.AntSolver.Simulator.enter(level, { useSlotStart: true, instantChain: ruleCfg.instantChain });
      const is014 = levelPath.indexOf('关卡14') >= 0;
      const is008 = levelPath.indexOf('关卡8') >= 0;
      const isV17 = levelPath.indexOf('原型_v17') >= 0;
      const isV15 = levelPath.indexOf('原型_v15') >= 0;
      const isV14 = levelPath.indexOf('原型_v14') >= 0;
      const levelLabel = is014
        ? 'E6 Final Holdout 014 v1 · Four Quarter'
        : is008
        ? (levelPath.indexOf('原型_v3') >= 0
          ? 'E6 Target 008 v3 · Story Graph'
          : levelPath.indexOf('原型_v2') >= 0
          ? 'E6 Target 008 v2 · Three Act'
          : 'E6 Target 008 v1 · Corridor')
        : isV17 ? 'E6 Target 006 v17 · Chain + Pipe'
        : isV15 ? 'E6 Target 006 v15 · Pressure + Chain'
        : isV14 ? 'E6 Target 006 v14 · Two Pressure Windows'
        : levelPath.indexOf('原型_v12') >= 0 ? 'E6 Target 006 v12 · Open Start'
        : levelPath.indexOf('原型_v11') >= 0 ? 'E6 Target 006 v11 · Three Paths'
        : levelPath.indexOf('原型_v10') >= 0 ? 'E6 Target 006 v10 · Dual Debt'
        : levelPath.indexOf('E5_v1') >= 0 ? 'E5 Delivery 006'
        : levelPath.indexOf('E4_combined') >= 0 ? 'E4 冰+链+黑'
        : levelPath.indexOf('E4_groupDebt') >= 0 ? 'E4 groupDebt'
        : levelPath.indexOf('E4_delayedGate') >= 0 ? 'E4 delayedGate'
        : levelPath.indexOf('v9') >= 0 ? 'E1-R3 Story Level v9'
        : levelPath.indexOf('v8') >= 0 ? 'E1-R2 Story Level v8'
        : levelPath.indexOf('v7') >= 0 ? 'E1-R1 Story Level v7'
        : levelPath.indexOf('v6') >= 0 ? 'Story Level v6'
        : levelPath.indexOf('v5') >= 0 ? 'Story Level v5'
        : levelPath.indexOf('v4') >= 0 ? 'Story Level v4'
        : levelPath.indexOf('v3') >= 0 ? 'Story Level v3'
        : levelPath.indexOf('v2') >= 0 ? 'Story Level v2'
        : '可玩原型 v1';
      document.title = (is014 ? '014' : is008 ? '008' : '006') + ' · ' + levelLabel;
      document.getElementById('title').textContent = document.title;
      document.getElementById('meta').textContent =
        state.boardRows + '×' + state.boardCols + ' · ' + state.totalBoxes + ' 车 · 消除顺序：' + ruleCfg.label;
      const storyButton = document.getElementById('story');
      const storyVariant = isV17 ? 'v17'
        : isV15 ? 'v15'
        : isV14 ? 'v14'
        : levelPath.indexOf('原型_v9') >= 0 ? 'v9'
        : levelPath.indexOf('原型_v8') >= 0 ? 'v8'
        : null;
      storyBeats = isV17 ? STORY_BEATS_V17 : (isV15 ? STORY_BEATS_V15 : STORY_BEATS_V8);
      storyButton.style.display = storyVariant ? '' : 'none';
      storyRoute = null;
      if (storyVariant) {
        const routePath = levelPath.replace(
          new RegExp('关卡_实验(?:_006)?_' + storyVariant + '\\.json(?:\\?.*)?$'),
          '关卡_实验' + (storyVariant === 'v17' || storyVariant === 'v15' || storyVariant === 'v14' ? '_006' : '') +
            '_' + storyVariant + '.route.json'
        );
        const response = await fetch(routePath);
        if (response.ok) storyRoute = await response.json();
      }
      logLines = [];
      update();
    }

    document.getElementById('reset').onclick = boot;
    document.getElementById('story').onclick = runStory;
    document.getElementById('rule').addEventListener('change', () => { boot().catch(e => console.error(e)); });
    boot().catch(err => {
      document.getElementById('status').textContent = '载入失败：' + err.message;
    });
  </script>
</body>
</html>
