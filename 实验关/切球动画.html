  listEl.innerHTML = ''; calcEl.innerHTML = ''; statEl.innerHTML = '';
  if (step === 0) {
    stageEl.textContent = '第 0 步：目标图（35×35，1225 个球，13 色）';
    subEl.textContent = '';
  } else if (step <= L) {
    stageEl.textContent = '第 1 步：洋葱剥层（白框 = 当前层）';
    subEl.textContent = '层 ' + (step - 1) + '：' + DATA.layerPx[step - 1] + ' 个球';
  } else {
    const idx = step - L - 1, u = DATA.units[idx];
    stageEl.textContent = '第 2 步：切球（层 ' + u.layer + ' · 色 ' + u.color + '）';
    calcEl.innerHTML = '<b>' + u.px + '</b> 个球 ÷ 上限 ' + HI + ' → <b>' + u.n + '</b> 辆（' + u.counts.join(' / ') + '）';
    subEl.textContent = '到期 ' + u.due.toFixed(2) + '　色块颜色见画布白框';
    // 重建列表：前面所有单元的车 + 当前单元的车
    for (let i = 0; i <= idx; i++) {
      const uu = DATA.units[i];
      for (let k = 0; k < uu.counts.length; k++) addCarCard(uu, k);
    }
    if (idx >= U - 1) {
      stageEl.textContent = '完成：' + DATA.units.length + ' 个单元 → ' + DATA.units.reduce((a, u) => a + u.counts.length, 0) + ' 辆车';
      calcEl.innerHTML = ''; subEl.textContent = '';
      showStat();
    }
  }
  seek.value = step;
  const pct = TOTAL ? Math.round(step / TOTAL * 100) : 0;
  barTxt.textContent = step + ' / ' + TOTAL + ' · ' + pct + '%';
  draw();
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }
function play() {
  stop();
  if (step >= TOTAL) render(0);
  timer = setInterval(function () {
    if (step >= TOTAL) { stop(); return; }
    render(step + 1);
  }, 520);
}
document.getElementById('play').onclick = play;
document.getElementById('pause').onclick = stop;
document.getElementById('replay').onclick = function () { stop(); render(0); play(); };
seek.oninput = function () { stop(); render(parseInt(seek.value, 10) || 0); };
seek.onmousedown = stop; seek.ontouchstart = stop;
render(0);
</script>
</body>
</html>
