<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关卡元素活路验证工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <h1>关卡元素活路验证工具</h1>
      <div class="actions">
        <button id="loadLevelBtn" type="button">加载关卡</button>
        <button id="validateBtn" type="button">验证元素</button>
        <input id="levelFileInput" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="fileNameLabel" class="file-label">未加载文件</div>
    </header>

    <section class="result-panel">
      <label for="resultOutput">验证结果</label>
      <textarea id="resultOutput" readonly placeholder="加载关卡文件后点击验证元素"></textarea>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
