<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目标图 TXT 编辑器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container simplified-app">
        <header class="toolbar">
            <h1>目标图 TXT 编辑器</h1>
        </header>

        <main class="main-content">
            <section class="zone target-zone">
                <div class="zone-header">
                    <h2>目标区</h2>
                </div>
                <div class="zone-controls">
                    <div class="control-group create-txt-group">
                        <label>TXT宽度:</label>
                        <input type="number" id="txtWidth" min="1" value="9">
                        <label>TXT高度:</label>
                        <input type="number" id="txtHeight" min="1" value="9">
                        <label>填充值:</label>
                        <input type="number" id="txtFillValue" min="0" value="0">
                        <button id="createTxtBtn" class="btn btn-primary">创建TXT</button>
                        <span class="hint">创建后会在下方编辑器显示空图，不会立即保存文件</span>
                    </div>
                    <div class="control-group">
                        <label>导入/导出:</label>
                        <button id="importTxtBtn" class="btn btn-secondary">导入TXT</button>
                        <button id="exportTxtBtn" class="btn btn-success">导出TXT</button>
                        <input type="file" id="txtFileInput" accept=".txt" hidden>
                    </div>
                    <div class="control-group">
                        <label>基础行数:</label>
                        <input type="number" id="baseRowCount" min="0" value="0">
                        <span class="hint">用于标记基础区域行数，不影响TXT矩阵导出</span>
                    </div>
                    <div class="control-group fill-tools-group">
                        <label>背景填充:</label>
                        <input type="number" id="backgroundFillColor" min="1" value="1">
                        <button id="backgroundFillBtn" class="btn btn-primary">确认填充0块</button>
                        <label>颜色填充:</label>
                        <button id="paintModeBtn" class="btn btn-secondary">拖拽填充：关</button>
                        <button id="selectModeBtn" class="btn btn-secondary">框选模式：关</button>
                        <button id="undoPaintBtn" class="btn btn-secondary" disabled>撤回 Ctrl/⌘+Z</button>
                        <span class="hint">拖拽填充：按住鼠标画笔替换；框选模式：拖拽选区后对区域操作</span>
                    </div>
                    <div class="control-group">
                        <label>选择颜色:</label>
                        <div id="targetColorPalette" class="color-palette"></div>
                    </div>
                    <div class="control-group special-panel">
                        <label>特殊功能:</label>
                        <div id="targetSpecialPanel" class="special-elements">
                            <button class="special-btn target-special-btn" data-type="0" title="清空问号标记">普通</button>
                            <button class="special-btn target-special-btn" data-type="1" title="问号">问号</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>缩放:</label>
                        <input type="range" id="targetZoom" min="4" max="120" value="40" step="1">
                        <input type="number" id="targetZoomInput" min="4" max="120" value="40" style="width:56px;">
                        <span>px</span>
                        <button id="zoomFitBtn" class="btn btn-secondary" title="自适应窗口大小">适应窗口</button>
                        <button id="zoomResetBtn" class="btn btn-secondary" title="重置为40px">重置</button>
                    </div>
                    <div class="control-group stats-group">
                        <label>颜色种类数:</label>
                        <span id="targetColorCount" class="stat-value">0</span>
                        <label>颜色组数:</label>
                        <span id="targetGroupCount" class="stat-value">0</span>
                    </div>
                    <!-- 颜色替换区域：全局 + 选区放在一起 -->
                    <div class="control-group color-replace-group">
                        <label>全局颜色替换:</label>
                        <div id="targetColorReplacePanel" class="color-replace-panel">
                            <span class="hint">导入或创建数据后显示</span>
                        </div>
                    </div>
                    <div id="selectionInfoPanel" class="control-group color-replace-group selection-info-group hidden">
                        <div class="selection-info-header">
                            <label>选区颜色替换:</label>
                            <span class="selection-meta" id="selectionMeta"></span>
                            <button id="selectionZoomInBtn" class="btn btn-primary" style="padding:3px 8px;font-size:11px;" title="放大选区视图">＋放大</button>
                            <button id="selectionZoomOutBtn" class="btn btn-primary" style="padding:3px 8px;font-size:11px;" title="缩小选区视图">－缩小</button>
                            <button id="selectionFillBtn" class="btn btn-primary" style="padding:3px 8px;font-size:11px;">用当前颜色填充选区</button>
                            <button id="selectionPaintBtn" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;">选区内拖拽：关</button>
                            <button id="selectionClearBtn" class="btn btn-secondary" style="padding:3px 8px;font-size:11px;">取消选区</button>
                        </div>
                        <div id="selectionColorPanel" class="color-replace-panel">
                            <span class="hint">框选区域后显示</span>
                        </div>
                    </div>
                    <!-- 孤立像素扫描 -->
                    <div class="control-group isolate-scan-group">
                        <div class="isolate-scan-header">
                            <label>孤立像素扫描:</label>
                            <button id="scanIsolateBtn" class="btn btn-primary" style="padding:3px 10px;font-size:12px;">扫描</button>
                            <button id="fixAllIsolateBtn" class="btn btn-secondary" style="padding:3px 10px;font-size:12px;" disabled>一键修复全部</button>
                            <span class="hint">检测被周围不同颜色包围的孤立像素（可能是生成错误）</span>
                        </div>
                        <div id="isolateResultPanel" class="isolate-result-panel">
                            <span class="hint">点击扫描按钮开始检测</span>
                        </div>
                    </div>
                </div>
                <!-- 网格区域：框选后变为左右分栏 -->
                <div class="zone-content-wrapper">
                    <div class="zone-content zone-content-main" id="zoneContentMain">
                        <div id="targetGrid" class="grid-container"></div>
                    </div>
                    <div class="zone-content zone-content-thumb hidden" id="zoneContentThumb">
                        <div class="thumb-label">全图缩略</div>
                        <div id="targetGridThumb" class="grid-container grid-thumb"></div>
                    </div>
                </div>
            </section>
        </main>

        <div id="colorReplaceModal" class="color-replace-modal hidden">
            <div class="color-replace-modal-backdrop"></div>
            <div class="color-replace-modal-box">
                <div class="color-replace-modal-header">
                    <span id="colorReplaceModalTitle">选择新颜色</span>
                    <button id="colorReplaceModalClose" class="color-replace-modal-close">✕</button>
                </div>
                <div id="colorReplaceModalPalette" class="color-replace-modal-palette"></div>
            </div>
        </div>

        <div id="selectionReplaceModal" class="color-replace-modal hidden">
            <div class="color-replace-modal-backdrop"></div>
            <div class="color-replace-modal-box">
                <div class="color-replace-modal-header">
                    <span id="selectionReplaceModalTitle">选区内替换颜色</span>
                    <button id="selectionReplaceModalClose" class="color-replace-modal-close">✕</button>
                </div>
                <div id="selectionReplaceModalPalette" class="color-replace-modal-palette"></div>
            </div>
        </div>

        <div id="errorToast" class="toast hidden"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/parsers.js"></script>
    <script src="js/managers.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
